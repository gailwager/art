name: Deploy to GitHub Pages

# NOTE: GitHub Pages must first be enabled once by the repository owner
# (Settings -> Pages -> Deploy from a branch -> main / root). After that this
# workflow is not needed; it exists only for the "GitHub Actions" source option.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
